<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>

</head>

<body>

<div class="auth-screen" id="auth-screen">

    <div class="auth-card">

        <h2>To Do List</h2>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-mode="login">Connexion</button>
            <button type="button" class="auth-tab" data-mode="register">Inscription</button>
        </div>

        <form class="auth-form" id="login-form">

            <label>
                Nom
                <input type="text" name="name" autocomplete="username" required>
            </label>

            <label>
                Mot de passe
                <input type="password" name="password" autocomplete="current-password" required>
            </label>

            <button type="submit">Se connecter</button>

        </form>

        <form class="auth-form hidden" id="register-form">

            <label>
                Nom
                <input type="text" name="name" autocomplete="username" required>
            </label>

            <label>
                Mot de passe
                <input type="password" name="password" autocomplete="new-password" required>
            </label>

            <button type="submit">Créer un compte</button>

        </form>

        <p class="auth-error" id="auth-error"></p>

    </div>

</div>

<header class="header">

    <h1>To Do List</h1>

    <div class="search">
        <span>🔍</span>
        <input type="text" placeholder="Search a task...">
    </div>

    <select class="filter">
        <option value="">Filter</option>
        <option value="priority">Priority</option>
        <option value="deadline">Deadline</option>
        <option value="status">Status</option>
    </select>

    <button class="add-task">+ Add </button>

    <button class="logout">Logout</button>

</header>

<main class="task-container">

    <!-- Left side : Task list -->
    <section class="task-list">

        <!--
            JavaScript will create the tasks here dynamically.

            Example of one task:

            <article class="task">
                ...
            </article>
        -->

    </section>


    <!-- Right side : Selected task details -->
    <aside class="task-details">

        <h2>Task Details</h2>

        <div class="detail">

            <h3>Name</h3>
            <p>...</p>

            <h3>Deadline</h3>
            <p>...</p>

            <h3>Priority</h3>
            <p>...</p>

            <h3>Description</h3>
            <p>...</p>

            <h3>Status</h3>
            <p>...</p>

        </div>

    </aside>

</main>

</body>

</html>
