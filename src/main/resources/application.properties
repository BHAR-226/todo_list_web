spring.application.name=todo-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# mot de passe du compte admin cree au premier demarrage (surchargeable par la variable d'environnement APP_ADMIN_PASSWORD)
app.admin.password=${APP_ADMIN_PASSWORD:admin-dev}
